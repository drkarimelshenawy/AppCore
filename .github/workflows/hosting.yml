name: AppCore Hosting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dashboard/**', 'firebase.json', '.github/workflows/hosting.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: appcore-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g firebase-tools@15.22.1
      - run: node --check dashboard/app.js && test -s dashboard/index.html && test -s dashboard/style.css
      - uses: google-github-actions/auth@v3
        with:
          project_id: appcore-2026
          workload_identity_provider: projects/316863421809/locations/global/workloadIdentityPools/appcore-github/providers/github
          service_account: appcore-deploy@appcore-2026.iam.gserviceaccount.com
      - run: firebase deploy --only hosting --project appcore-2026 --non-interactive
      - run: curl --fail --retry 3 --retry-delay 5 https://appcore-2026.web.app/ | grep -q AppCore
