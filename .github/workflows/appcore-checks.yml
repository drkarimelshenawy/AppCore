name: AppCore checks
on:
  push:
    branches: [feat/appcore-command-center]
  pull_request:
  workflow_dispatch:
concurrency:
  group: appcore-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/app.js
      - run: node --input-type=module --check < dashboard/auth.js
      - run: node --check functions/index.js
      - run: node -e 'JSON.parse(require("fs").readFileSync("firebase.json")); JSON.parse(require("fs").readFileSync("functions/package.json"))'

      - run: node --test functions/test/*.test.js
      - run: node -e 'JSON.parse(require("fs").readFileSync("firestore.indexes.json"))'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase@11.10.0 @firebase/rules-unit-testing@4 firebase-tools@14
      - run: npx firebase emulators:exec --only firestore --project demo-appcore "node --test tests/firestore.test.cjs"
